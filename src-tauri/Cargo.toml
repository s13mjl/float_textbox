[package]
name = "float-textbox"
version = "0.1.0"
description = "桌面置顶悬浮文本框"
authors = ["s13mjl"]
edition = "2021"

[lib]
name = "float_textbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
